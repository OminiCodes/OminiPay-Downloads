<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="refresh" content="0; url=https://ominipay-ivory-charcoal-gold.ominipay.pages.dev/">
  <title>OminiPay web preview moved</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070706; color: #F4F1EC; }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
    a { display: inline-block; margin-top: 1rem; color: #FFFFFF; background: #3B2A20; padding: .9rem 1.2rem; border-radius: .75rem; text-decoration: none; font-weight: 700; }
    p { color: #B9B2A8; line-height: 1.6; }
  </style>
  <script>
    (function () {
      var target = "https://ominipay-ivory-charcoal-gold.ominipay.pages.dev/";
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          })
          .catch(function () {})
          .finally(function () { window.location.replace(target); });
      } else {
        window.location.replace(target);
      }
    })();
  </script>
</head>
<body>
  <main>
    <h1>OminiPay preview has moved</h1>
    <p>Opening the current OminiPay web preview. If you are not redirected automatically, use the link below.</p>
    <a href="https://ominipay-ivory-charcoal-gold.ominipay.pages.dev/">Open current OminiPay preview</a>
  </main>
</body>
</html>
