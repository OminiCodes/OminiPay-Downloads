<!DOCTYPE html>
<html>
<head>
  <base href="/OminiPay-Downloads/app/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OminiPay — a multi-currency digital wallet and payments platform in development.">
  <meta name="theme-color" content="#0F0E0D">
  <style>
    html, body { background: #000000; margin: 0; min-height: 100%; }
    #ominipay-web-splash {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 0;
      background: #000000; color: #F4F1EC;
      font-family: Arial, sans-serif;
    }
    #ominipay-web-splash .brand-mark { width: min(240px, 58vw); height: auto; display: block; }
    #ominipay-web-splash .wordmark { margin-top: 24px; font-size: clamp(42px, 11vw, 56px); font-weight: 700; letter-spacing: -2px; line-height: 1.05; }
    #ominipay-web-splash .wordmark .omini { color: #FFFFFF; }
    #ominipay-web-splash .wordmark .pay { color: #FFC928; }
    #ominipay-web-splash .loader {
      width: 72px; height: 72px; margin-top: 62px;
      border: 7px solid #292929;
      border-top-color: #FFC928; border-left-color: #FFC928;
      border-radius: 50%; animation: ominipay-spin 1.1s linear infinite;
    }
    #ominipay-web-splash .tagline { margin-top: 70px; color: #E6E6E6; font-size: clamp(18px, 4.6vw, 22px); font-weight: 400; text-align: center; }
    @keyframes ominipay-spin { to { transform: rotate(360deg); } }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OminiPay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>OminiPay</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="ominipay-web-splash" role="status" aria-label="Loading OminiPay">
    <svg class="brand-mark" viewBox="0 0 200 200" role="img" aria-label="OminiPay gold wallet emblem">
      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFF1A6"/><stop offset=".25" stop-color="#FFD84A"/>
          <stop offset=".52" stop-color="#E69B00"/><stop offset=".78" stop-color="#FFD94A"/>
          <stop offset="1" stop-color="#FFF0A0"/>
        </linearGradient>
      </defs>
      <rect x="12" y="12" width="176" height="176" rx="38" fill="url(#gold)" stroke="#FFF0A0" stroke-width="2"/>
      <path d="M61 49h72q18 0 18 18v9h-34q-18 0-18 18v17q0 18 18 18h34v6q0 18-18 18H61q-18 0-18-18V67q0-18 18-18Z" fill="#101010"/>
      <rect x="91" y="82" width="66" height="42" rx="9" fill="#101010" stroke="url(#gold)" stroke-width="5"/>
      <circle cx="126" cy="103" r="9" fill="url(#gold)"/>
    </svg>
    <div class="wordmark"><span class="omini">Omini</span><span class="pay">Pay</span></div>
    <div class="loader" aria-hidden="true"></div>
    <div class="tagline">Starting your secure wallet...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('ominipay-web-splash');
      if (splash) splash.remove();
    });
  </script>
  <script src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js" type="application/javascript"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
